name: Termux-Sathi Checks

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax
        shell: bash
        run: |
          set -e
          bash -n setup.sh
          bash -n termux-sathi.sh
          find labs -type f -name "*.sh" -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            bash -n "$file"
          done

      - name: Python syntax
        run: |
          python3 -m py_compile labs/python-lab.py
