name: Build Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk Termux-Sathi-debug.apk
          ls -lh Termux-Sathi-debug.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Termux-Sathi-debug-apk
          path: Termux-Sathi-debug.apk
          if-no-files-found: error

      - name: Publish latest debug APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete termux-sathi-debug --cleanup-tag -y || true
          gh release create termux-sathi-debug Termux-Sathi-debug.apk             --target "$GITHUB_SHA"             --title "Termux-Sathi Debug APK"             --notes "Automatically built debug APK from the latest Android app source."
