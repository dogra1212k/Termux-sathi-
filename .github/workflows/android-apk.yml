name: Android app checks and bundles

on:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['android-app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test, lint and build
        working-directory: android-app
        run: gradle :app:testDebugUnitTest :app:lintRelease :app:assembleDebug :app:bundleRelease :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Prepare named artifacts
        run: |
          mkdir -p dist
          cp android-app/app/build/outputs/apk/debug/app-debug.apk dist/Termux-Sathi-3.1.0-debug.apk
          cp android-app/app/build/outputs/bundle/release/app-release.aab dist/Termux-Sathi-3.1.0-UNSIGNED.aab
          cd dist
          sha256sum *.apk *.aab > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Termux-Sathi-3.1.0-build
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: |
            android-app/app/build/reports/
            android-app/app/build/test-results/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device smoke test (Android 16)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          working-directory: android-app
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace
            mkdir -p screenshots
            adb pull /sdcard/Pictures/TermuxSathi screenshots/
      - name: Upload actual emulator screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Termux-Sathi-phone-screenshots
          path: android-app/screenshots/
          if-no-files-found: error
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-test-reports
          path: android-app/app/build/reports/androidTests/
